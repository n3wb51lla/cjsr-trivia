<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:16px}
.row{display:flex;gap:10px}
.sw{flex:1;height:104px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-shadow:var(--shadow-xs)}
.n{font-size:12px;font-weight:600}.h{font-family:var(--font-mono);font-size:11px;opacity:.75}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--gold-200);color:#7a5a10"><span class="n">gold-200</span><span class="h">#f8e6bd</span></div>
<div class="sw" style="background:var(--gold-300);color:#7a5a10"><span class="n">gold-300</span><span class="h">#f2d492</span></div>
<div class="sw" style="background:var(--gold-400);color:#5c4410"><span class="n">gold-400</span><span class="h">#ecc063</span></div>
<div class="sw" style="background:var(--gold-500);color:#3a2a08"><span class="n">gold-500</span><span class="h">#e3a838</span></div>
<div class="sw" style="background:var(--gold-600);color:#fff"><span class="n">gold-600</span><span class="h">#c68a20</span></div>
<div class="sw" style="background:var(--gold-700);color:#fff"><span class="n">gold-700</span><span class="h">#9c6a17</span></div>
</div></body></html>

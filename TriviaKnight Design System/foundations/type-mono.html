<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:22px}
.eb{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);font-size:13px;font-weight:600;color:var(--accent-strong)}
.badge{display:inline-block;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:600;color:var(--navy-900);background:var(--gold-300);padding:4px 10px;border-radius:var(--radius-pill);margin-top:14px}
.lbl{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-top:14px}
</style></head><body>
<p class="eb">Trivia night software built for hosts</p>
<span class="badge">Most Popular</span>
<p class="lbl">$19&nbsp;/&nbsp;month · $190&nbsp;/&nbsp;year</p>
</body></html>

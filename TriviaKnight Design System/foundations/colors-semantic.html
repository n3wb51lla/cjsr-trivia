<!-- @dsCard group="Colors" viewport="700x140" name="Semantic status" subtitle="Restrained, brand-harmonious success / warning / danger / info" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:16px}
.row{display:flex;gap:10px}
.sw{flex:1;height:92px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff}
.n{font-size:12px;font-weight:600}.h{font-family:var(--font-mono);font-size:11px;opacity:.85}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--success)"><span class="n">success</span><span class="h">#237a52</span></div>
<div class="sw" style="background:var(--warning);color:#3a2a08"><span class="n">warning</span><span class="h">#dca02c</span></div>
<div class="sw" style="background:var(--danger)"><span class="n">danger</span><span class="h">#b33f32</span></div>
<div class="sw" style="background:var(--info)"><span class="n">info</span><span class="h">#3f7cb1</span></div>
</div></body></html>

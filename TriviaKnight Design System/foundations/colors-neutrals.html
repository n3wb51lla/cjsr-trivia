<!-- @dsCard group="Colors" viewport="700x150" name="Paper & slate neutrals" subtitle="Off-white content surfaces and cool neutral ramp" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:16px}
.row{display:flex;gap:8px}.row+.row{margin-top:8px}
.sw{flex:1;height:52px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:7px;border:1px solid rgba(0,0,0,.06)}
.n{font-size:10.5px;font-weight:600}.h{font-family:var(--font-mono);font-size:9.5px;opacity:.7}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--paper-0);color:#333"><span class="n">paper-0</span><span class="h">#ffffff</span></div>
<div class="sw" style="background:var(--paper-50);color:#333"><span class="n">paper-50</span><span class="h">#faf8f3</span></div>
<div class="sw" style="background:var(--paper-100);color:#333"><span class="n">paper-100</span><span class="h">#f3efe5</span></div>
<div class="sw" style="background:var(--paper-200);color:#333"><span class="n">paper-200</span><span class="h">#e9e3d4</span></div>
</div>
<div class="row">
<div class="sw" style="background:var(--slate-100);color:#333"><span class="n">slate-100</span></div>
<div class="sw" style="background:var(--slate-200);color:#333"><span class="n">slate-200</span></div>
<div class="sw" style="background:var(--slate-300);color:#333"><span class="n">slate-300</span></div>
<div class="sw" style="background:var(--slate-400);color:#fff"><span class="n">slate-400</span></div>
<div class="sw" style="background:var(--slate-500);color:#fff"><span class="n">slate-500</span></div>
<div class="sw" style="background:var(--slate-600);color:#fff"><span class="n">slate-600</span></div>
<div class="sw" style="background:var(--slate-700);color:#fff"><span class="n">slate-700</span></div>
<div class="sw" style="background:var(--slate-900);color:#fff"><span class="n">slate-900</span></div>
</div></body></html>

<!-- @dsCard group="Brand" viewport="700x150" name="Iconography — Lucide" subtitle="24px, ~2px stroke, monochrome (currentColor)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:22px;color:var(--navy-800)}
.row{display:flex;gap:26px;flex-wrap:wrap}
.i{display:flex;flex-direction:column;align-items:center;gap:7px;width:64px}
.i svg{width:26px;height:26px;stroke-width:2}
.i span{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.gold{color:var(--accent-strong)}
</style></head><body>
<div class="row">
<div class="i"><i data-lucide="layout-grid"></i><span>builder</span></div>
<div class="i"><i data-lucide="list-checks"></i><span>rounds</span></div>
<div class="i"><i data-lucide="monitor-play"></i><span>present</span></div>
<div class="i"><i data-lucide="timer"></i><span>timer</span></div>
<div class="i"><i data-lucide="trophy"></i><span>score</span></div>
<div class="i gold"><i data-lucide="crown"></i><span>champion</span></div>
<div class="i"><i data-lucide="users"></i><span>teams</span></div>
<div class="i"><i data-lucide="infinity"></i><span>unlimited</span></div>
<div class="i"><i data-lucide="shield"></i><span>brand</span></div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons()</script>
</body></html>

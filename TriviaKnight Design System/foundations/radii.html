<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Moderate modern-SaaS rounding" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:20px;display:flex;gap:16px;flex-wrap:wrap}
.b{width:92px;height:92px;background:var(--navy-800);color:#f4f6fb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.n{font-size:12px;font-weight:600}.h{font-family:var(--font-mono);font-size:10px;opacity:.7}
</style></head><body>
<div class="b" style="border-radius:var(--radius-sm)"><span class="n">sm</span><span class="h">6px</span></div>
<div class="b" style="border-radius:var(--radius-md)"><span class="n">md</span><span class="h">10px</span></div>
<div class="b" style="border-radius:var(--radius-lg)"><span class="n">lg</span><span class="h">16px</span></div>
<div class="b" style="border-radius:var(--radius-xl)"><span class="n">xl</span><span class="h">22px</span></div>
<div class="b" style="border-radius:var(--radius-2xl)"><span class="n">2xl</span><span class="h">28px</span></div>
<div class="b" style="border-radius:var(--radius-pill)"><span class="n">pill</span><span class="h">999px</span></div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:#fff;padding:16px}
.row{display:flex;gap:10px}
.sw{flex:1;height:104px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#f4f6fb;box-shadow:var(--shadow-xs)}
.n{font-size:12px;font-weight:600}.h{font-family:var(--font-mono);font-size:11px;opacity:.75}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--navy-950)"><span class="n">navy-950</span><span class="h">#070b16</span></div>
<div class="sw" style="background:var(--navy-900)"><span class="n">navy-900</span><span class="h">#0b1120</span></div>
<div class="sw" style="background:var(--navy-800)"><span class="n">navy-800</span><span class="h">#111a30</span></div>
<div class="sw" style="background:var(--navy-700)"><span class="n">navy-700</span><span class="h">#1a2742</span></div>
<div class="sw" style="background:var(--navy-600)"><span class="n">navy-600</span><span class="h">#243453</span></div>
<div class="sw" style="background:var(--navy-500)"><span class="n">navy-500</span><span class="h">#33456a</span></div>
</div></body></html>

<!-- @dsCard group="Effects" viewport="700x180" name="Elevation" subtitle="Soft layered shadows + gold glow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-body);background:var(--paper-50);padding:26px;display:flex;gap:22px;flex-wrap:wrap}
.b{width:110px;height:80px;background:#fff;border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.n{font-size:12px;font-weight:600;color:var(--text-strong)}.h{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
<div class="b" style="box-shadow:var(--shadow-sm)"><span class="n">sm</span></div>
<div class="b" style="box-shadow:var(--shadow-md)"><span class="n">md</span><span class="h">cards</span></div>
<div class="b" style="box-shadow:var(--shadow-lg)"><span class="n">lg</span><span class="h">hover</span></div>
<div class="b" style="box-shadow:var(--shadow-xl)"><span class="n">xl</span></div>
<div class="b" style="box-shadow:var(--shadow-gold)"><span class="n">gold</span><span class="h">featured</span></div>
</body></html>
